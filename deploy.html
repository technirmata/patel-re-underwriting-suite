<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Suite — Deploy Dashboard</title>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; padding:40px 20px; }
  .container { max-width:700px; margin:0 auto; }
  h1 { font-size:24px; font-weight:700; margin-bottom:6px; }
  .subtitle { color:var(--muted); font-size:14px; margin-bottom:40px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:20px; }
  .card h2 { font-size:15px; font-weight:600; margin-bottom:16px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=password] { width:100%; background:#0d1117; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 14px; font-size:14px; outline:none; transition:border-color .2s; }
  input:focus { border-color:var(--accent); }
  .file-drop { border:2px dashed var(--border); border-radius:10px; padding:32px; text-align:center; cursor:pointer; transition:all .2s; position:relative; }
  .file-drop:hover, .file-drop.over { border-color:var(--accent); background:rgba(88,166,255,.05); }
  .file-drop input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .file-drop .icon { font-size:32px; margin-bottom:8px; }
  .file-drop .hint { font-size:13px; color:var(--muted); }
  .file-drop .selected { font-size:14px; color:var(--green); font-weight:600; margin-top:6px; }
  button { width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:all .15s; }
  .btn-deploy { background:var(--green); color:#000; }
  .btn-deploy:hover:not(:disabled) { background:#56d364; }
  .btn-deploy:disabled { opacity:.5; cursor:not-allowed; }
  .status { padding:16px; border-radius:10px; font-size:14px; margin-top:16px; display:none; }
  .status.info { background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.3); color:var(--accent); }
  .status.success { background:rgba(63,185,80,.1); border:1px solid rgba(63,185,80,.3); color:var(--green); }
  .status.error { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.3); color:var(--red); }
  .current-deploy { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#0d1117; border-radius:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--green); flex-shrink:0; box-shadow:0 0 8px var(--green); }
  .deploy-info { flex:1; min-width:0; }
  .deploy-info .label { font-size:11px; color:var(--muted); }
  .deploy-info .value { font-size:13px; font-weight:600; }
  .live-link { color:var(--accent); font-size:13px; text-decoration:none; }
  .live-link:hover { text-decoration:underline; }
  .divider { border:none; border-top:1px solid var(--border); margin:24px 0; }
  .step { display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; }
  .step-num { background:var(--accent); color:#000; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .step-text { font-size:14px; color:var(--muted); line-height:1.5; }
  code { background:#0d1117; border:1px solid var(--border); border-radius:4px; padding:2px 6px; font-family:monospace; font-size:13px; }
  .progress-bar { height:4px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:12px; display:none; }
  .progress-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
  .note { background:rgba(210,153,34,.1); border:1px solid rgba(210,153,34,.3); border-radius:8px; padding:12px 16px; font-size:13px; color:var(--yellow); margin-bottom:20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🏢 JP Underwriting Suite</h1>
  <p class="subtitle">Deploy Dashboard — push updates to GitHub Pages</p>

  <div class="note">
    ⚠️ <strong>Open this file from a web server, not directly from your desktop.</strong>
    For leasiest deploy, open <a href="https://technirmata.github.io/jp-underwriting-suite/deploy.html" style="color:var(--yellow)">the hosted version</a>,
    or run <code>python deploy.py</code> from Terminal instead.
  </div>
